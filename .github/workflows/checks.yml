name: Host tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake python3 pkg-config libcurl4-openssl-dev libexpat1-dev libmbedtls-dev
      - name: Check repository contents
        run: python3 scripts/check-repository.py
      - name: Run host tests
        run: bash scripts/test-host.sh
